name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # AGP 8.2 needs JDK 17. The runner image already ships the Android SDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          # Maven Central sometimes answers "429 Too Many Requests" to shared runners: try again a few times
          for i in 1 2 3; do ./gradlew assembleDebug --stacktrace && exit 0; echo "Attempt $i failed"; sleep 45; done
          exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: FuruGit-debug
          path: app/build/outputs/apk/debug/*.apk
