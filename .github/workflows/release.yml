name: Release

# Push a tag such as v1.00 (or v1.00-beta for a pre-release) to build a signed APK
# and publish it as a GitHub release. The in-app updater downloads the first .apk
# asset of the latest release, so this workflow attaches exactly one APK.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded (base64 -w0 release.jks)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against versionName and CHANGELOG
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="${TAG#v}"
          BASE="${BASE%%-*}"
          VER="$(grep -oP 'versionName "\K[^"]+' app/build.gradle)"
          if [ "$BASE" != "$VER" ]; then
            echo "::error::Tag $TAG does not match versionName $VER in app/build.gradle"
            exit 1
          fi
          awk -v v="$VER" '$0 == "## " v { f = 1; next } /^## / && f { exit } f' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $VER' section"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      # AGP 8.2 needs JDK 17. The runner image already ships the Android SDK (see build.yml).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          export FURUARC_JAVA="$JAVA_HOME/bin/java"
          ./gradlew assembleRelease --stacktrace

      - name: Verify the signature and name the files
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::$APK was not produced (an unsigned build is named app-release-unsigned.apk)"
            ls -l app/build/outputs/apk/release || true
            exit 1
          fi
          BT="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/FuruGit-v${{ steps.meta.outputs.version }}.apk"
          (cd dist && sha256sum "FuruGit-v${{ steps.meta.outputs.version }}.apk" > SHA256SUMS.txt)
          {
            echo
            echo "**SHA-256**"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> release_notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          name: FuruGit ${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          files: |
            dist/FuruGit-v${{ steps.meta.outputs.version }}.apk
            dist/SHA256SUMS.txt

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
